services:
  db:
    image: pgvector/pgvector:pg17
    container_name: postgres-dev
    restart: always
    environment:
      # Docker Compose automatically looks for a .env file in the same folder
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backs the BullMQ job queue (document analysis runs in the background
  # here) and the shared, restart-durable rate-limit store.
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data: